[project]
name = "mininotebook"
version = "0.2.0"
description = "MiniNotebook: AI Literature Review & Research Assistant using Section-Aware Hybrid RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "arxiv>=2.1.3",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "rapidocr-onnxruntime>=1.3.0",
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "fastembed>=0.3.6",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
