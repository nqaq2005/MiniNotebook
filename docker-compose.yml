services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mininotebook_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_server_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - mininotebook_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mininotebook_app
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=research_papers
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-medium}
      - LLM_LANGUAGE=${LLM_LANGUAGE:-vi}
    volumes:
      - ./data/raw_pdfs:/app/data/raw_pdfs
      - ./data/parsed_md:/app/data/parsed_md
      - ./data/models_cache:/app/data/models_cache
      - ./data/citation_graph:/app/data/citation_graph
      - ./data/vector_db:/app/data/vector_db
    restart: unless-stopped
    networks:
      - mininotebook_net

networks:
  mininotebook_net:
    driver: bridge
